  <body>
    <style>
      #lumen-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background:
          radial-gradient(ellipse at 50% 35%, rgba(201, 168, 76, 0.12), transparent 60%),
          radial-gradient(ellipse at 50% 80%, rgba(201, 168, 76, 0.06), transparent 70%),
          #0d0d0d;
        color: #f0d78c;
        font-family: "Fraunces", Georgia, serif;
        opacity: 1;
        transition: opacity 480ms ease;
      }
      #lumen-splash.is-hiding { opacity: 0; pointer-events: none; }
      #lumen-splash .lumen-logo-wrap {
        position: relative;
        width: 132px;
        height: 132px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #lumen-splash .lumen-logo-wrap::before {
        content: "";
        position: absolute;
        inset: -20%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(240, 215, 140, 0.35), transparent 60%);
        filter: blur(14px);
        animation: lumen-halo 3.6s ease-in-out infinite;
      }
      #lumen-splash .lumen-logo-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("/lumen-orrery.png");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        mix-blend-mode: screen;
        opacity: 0;
        filter: brightness(1.6) sepia(1) hue-rotate(-15deg) saturate(3);
        animation: lumen-sparkle 3.6s ease-in-out infinite;
        pointer-events: none;
      }
      #lumen-splash img.lumen-logo {
        position: relative;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0 0 rgba(240, 215, 140, 0));
        animation: lumen-glow 3.6s ease-in-out infinite;
      }
      #lumen-splash .lumen-name {
        font-size: 1.75rem;
        letter-spacing: 0.04em;
        color: #f0d78c;
        text-shadow: 0 0 18px rgba(201, 168, 76, 0.35);
      }
      #lumen-splash .lumen-name small {
        display: block;
        margin-top: 6px;
        font-family: "Geist", system-ui, sans-serif;
        font-size: 0.65rem;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: rgba(240, 215, 140, 0.55);
      }
      @keyframes lumen-glow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(201, 168, 76, 0.25)); }
        50%      { filter: drop-shadow(0 0 18px rgba(240, 215, 140, 0.7)); }
      }
      @keyframes lumen-halo {
        0%, 100% { opacity: 0.35; transform: scale(0.96); }
        50%      { opacity: 0.7;  transform: scale(1.04); }
      }
      @keyframes lumen-sparkle {
        0%, 100% { opacity: 0; }
        50%      { opacity: 0.85; }
      }
      @media (prefers-reduced-motion: reduce) {
        #lumen-splash .lumen-logo-wrap::before,
        #lumen-splash .lumen-logo-wrap::after,
        #lumen-splash img.lumen-logo { animation: none; }
      }
    </style>
    <div id="lumen-splash" aria-hidden="true">
      <div class="lumen-logo-wrap">
        <img class="lumen-logo" src="/lumen-orrery.png" alt="" />
      </div>
      <div class="lumen-name">
        Lumen Planner
        <small>seu dia em órbita</small>
      </div>
    </div>
    <script>
      (function () {
        try {
          if (sessionStorage.getItem("lumen-splash-shown") === "1") {
            var s = document.getElementById("lumen-splash");
            if (s && s.parentNode) s.parentNode.removeChild(s);
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
